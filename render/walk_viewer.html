<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Walk-Through</title>
<style>
  :root { --ink:#1f1d1a; --muted:#6b665e; --paper:#f6f3ee; --line:#d9d3c8; --accent:#8a6a3a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#dfe6ea; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color:var(--ink); overflow:hidden; }
  #view { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  .panel { position:fixed; left:12px; top:12px; background:rgba(246,243,238,0.94); border:1px solid var(--line); border-radius:10px; padding:10px 12px; max-width:290px; box-shadow:0 4px 18px rgba(0,0,0,0.08); }
  .brand { font-size:11px; letter-spacing:0.28em; color:var(--muted); }
  h1 { font-size:16px; margin:2px 0 8px; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  button { font:inherit; font-size:12px; padding:6px 9px; border:1px solid var(--line); background:#fff; border-radius:7px; cursor:pointer; color:var(--ink); }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .hint { font-size:11px; color:var(--muted); line-height:1.45; margin-top:6px; }
  #status { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(246,243,238,0.95); padding:14px 18px; border-radius:10px; border:1px solid var(--line); font-size:13px; }
  .pad { position:fixed; right:14px; bottom:14px; display:grid; grid-template-columns:repeat(3, 46px); grid-template-rows:repeat(2, 46px); gap:6px; }
  .pad button { font-size:18px; padding:0; }
  #hud { position:fixed; right:12px; top:12px; font-size:11px; color:var(--muted); background:rgba(246,243,238,0.85); padding:5px 8px; border-radius:7px; border:1px solid var(--line); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div class="panel">
  <div class="brand">HELIOS DEVELOPMENT</div>
  <h1>PROJECT NAME, ADDRESS</h1>
  <div class="row" id="modes">
    <button data-mode="orbit" class="on">Orbit</button>
    <button data-mode="walk">Walk</button>
  </div>
  <div class="row" id="spots"></div>
  <div class="row">
    <button id="toggleRoof">Roof on</button>
    <button id="toggleF2">Floor 2 on</button>
  </div>
  <div class="hint" id="hint">Orbit: drag to turn, scroll or pinch to zoom, right-drag to pan.</div>
</div>
<div id="hud"></div>
<div class="pad" id="pad" style="display:none">
  <span></span><button data-k="f">&#9650;</button><span></span>
  <button data-k="l">&#9664;</button><button data-k="b">&#9660;</button><button data-k="r">&#9654;</button>
</div>
<div id="status">Loading the model&hellip;</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const IN = 0.0254;
// house grid (inches, X east, Y plan-north, Z up) -> glTF (metres, Y up, -Z plan-north)
const P = (x, y, z) => new THREE.Vector3(x * IN, z * IN, -y * IN);
const SPOTS = [
  { name: 'Street',        pos: P(40, -1150, 64),   look: P(40, -300, 150), floor: 0 },
  { name: 'Entry',         pos: P(110, -370, 64),   look: P(110, -100, 70), floor: 0 },
  { name: 'Living room',   pos: P(130, 30, 64),     look: P(270, 97, 110), floor: 0 },
  { name: 'Kitchen',       pos: P(-40, 300, 64),    look: P(80, 330, 50), floor: 0 },
  { name: 'Primary suite', pos: P(150, -120, 218),  look: P(150, -280, 200), floor: 1 },
  { name: 'Rear yard',     pos: P(110, 560, 64),    look: P(110, 150, 140), floor: 0 },
];
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ec);
scene.fog = new THREE.Fog(0xcfe0ec, 60, 160);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x8a8170, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
sun.position.set(-20, 30, 18); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 }); sun.shadow.bias = -0.0005;
sun.target.position.set(1, 0, -2); scene.add(sun, sun.target);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 400);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.copy(P(40, 0, 100)); camera.position.copy(P(-900, -1500, 800)); orbit.update();

const solids = []; const roofParts = []; const f2Parts = [];
const status = document.getElementById('status');
const loader = new GLTFLoader();
async function load(name) {          // the models ship as base64 modules (the host serves scripts, not .glb)
  const m = await import('./' + name + '.js');
  const bin = Uint8Array.from(atob(m.default), c => c.charCodeAt(0)).buffer;
  return await new Promise((res, rej) => loader.parse(bin, './', g => res(g), rej));
}
Promise.all([load('house'), load('rooms').catch(() => null)]).then(gs => {
  for (const g of gs) {
    if (!g) continue;
    g.scene.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      const m = o.material; const nm = (o.name || '').toLowerCase();
      if (m && m.transparent) { o.castShadow = false; m.depthWrite = false; }
      if (nm.startsWith('roof') || nm.startsWith('gutter') || nm.startsWith('fascia') || nm.startsWith('soffit') || nm.startsWith('attic')) roofParts.push(o);
      const bb = new THREE.Box3().setFromObject(o);
      if (bb.min.y > 3.6 * 1 && bb.min.y < 8 && !roofParts.includes(o)) f2Parts.push(o);
      if (!(m && m.transparent) && !nm.startsWith('tree_canopy')) solids.push(o);
    });
    scene.add(g.scene);
  }
  status.style.display = 'none';
}).catch(e => { status.textContent = 'The model could not load: ' + e.message; });

// ---- modes
let mode = 'orbit'; let floorZ = 0; let yaw = 0, pitch = 0;
const keys = {};
const modeBtns = document.querySelectorAll('#modes button');
function setMode(m) {
  mode = m; modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  orbit.enabled = (m === 'orbit');
  document.getElementById('pad').style.display = (m === 'walk') ? 'grid' : 'none';
  document.getElementById('hint').textContent = m === 'walk'
    ? 'Walk: W A S D or the arrows to move, drag to look. Walls and glass stop you; the floors step up and down.'
    : 'Orbit: drag to turn, scroll or pinch to zoom, right-drag to pan.';
}
modeBtns.forEach(b => b.onclick = () => setMode(b.dataset.mode));
function goto(s) {
  camera.position.copy(s.pos);
  const d = new THREE.Vector3().subVectors(s.look, s.pos).normalize();
  yaw = Math.atan2(-d.x, -d.z); pitch = Math.asin(Math.max(-0.99, Math.min(0.99, d.y)));
  setMode('walk'); applyLook();
}
const spots = document.getElementById('spots');
for (const s of SPOTS) { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => goto(s); spots.appendChild(b); }
document.getElementById('toggleRoof').onclick = e => { const v = !roofParts[0]?.visible; roofParts.forEach(o => o.visible = v); e.target.textContent = v ? 'Roof on' : 'Roof off'; };
document.getElementById('toggleF2').onclick = e => { const v = !f2Parts[0]?.visible; f2Parts.forEach(o => o.visible = v); roofParts.forEach(o => o.visible = v); e.target.textContent = v ? 'Floor 2 on' : 'Floor 2 off'; };

function applyLook() {
  const q = new THREE.Euler(pitch, yaw, 0, 'YXZ'); camera.quaternion.setFromEuler(q);
}
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { if (mode !== 'walk') return; dragging = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging || mode !== 'walk') return;
  yaw -= (e.clientX - lx) * 0.004; pitch -= (e.clientY - ly) * 0.004; pitch = Math.max(-1.3, Math.min(1.3, pitch));
  lx = e.clientX; ly = e.clientY; applyLook();
});
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k; const on = () => keys['pad_' + k] = true, off = () => keys['pad_' + k] = false;
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off);
});

const ray = new THREE.Raycaster(); const EYE = 64 * IN; const RAD = 0.32;
function blocked(from, dir, dist) {
  for (const h of [1.15]) {                 // chest height only: stairs and low furniture let you pass
    const o = from.clone(); o.y = from.y - EYE + h;
    ray.set(o, dir); ray.far = dist + RAD;
    if (ray.intersectObjects(solids, false).length) return true;
  }
  return false;
}
function groundAt(p) {
  const o = p.clone(); o.y += 0.6; ray.set(o, new THREE.Vector3(0, -1, 0)); ray.far = 6;
  const h = ray.intersectObjects(solids, false)[0];
  return h ? h.point.y : null;
}
const clock = new THREE.Clock(); const hud = document.getElementById('hud');
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (mode === 'walk') {
    const f = (keys['w'] || keys['arrowup'] || keys['pad_f']) ? 1 : (keys['s'] || keys['arrowdown'] || keys['pad_b']) ? -1 : 0;
    const t = (keys['d'] || keys['pad_r']) ? 1 : (keys['a'] || keys['pad_l']) ? -1 : 0;
    if (keys['arrowleft']) { yaw += 1.6 * dt; applyLook(); }
    if (keys['arrowright']) { yaw -= 1.6 * dt; applyLook(); }
    if (f || t) {
      const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)); const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const mv = fwd.multiplyScalar(f).add(right.multiplyScalar(t)).normalize(); const step = 1.5 * dt;
      if (!blocked(camera.position, mv, step)) camera.position.addScaledVector(mv, step);
    }
    const g = groundAt(camera.position);
    if (g !== null) { const target = g + EYE; camera.position.y += (target - camera.position.y) * Math.min(1, dt * 10); }
  } else { orbit.update(); }
  const p = camera.position; hud.textContent = `x ${(p.x / IN / 12).toFixed(1)} ft   y ${(-p.z / IN / 12).toFixed(1)} ft   eye ${(p.y / IN / 12).toFixed(1)} ft`;
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
tick();
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
</body>
</html>
